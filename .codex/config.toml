# Codex project config (loaded only when this repo is trusted in Codex).
# 공통 규칙은 AGENTS.md, 공용 스킬은 .agents/skills/ 에 있습니다.
# 개인 설정(모델, 인증 등)은 ~/.codex/config.toml 에 두세요.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
# pnpm install / 패키지 메타데이터 조회에 필요
network_access = true
