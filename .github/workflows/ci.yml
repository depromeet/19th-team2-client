name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 브랜치 이름 규칙 검사
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if ! echo "$BRANCH" | grep -Eq '^(feat|fix|chore|docs|refactor)/[a-z0-9][a-z0-9._-]*$'; then
            echo "::error::브랜치 이름 규칙 위반: '$BRANCH' (형식: feat|fix|chore|docs|refactor/설명, 예: feat/group-buy-detail)"
            exit 1
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # SDK 58과 맞지 않는 의존성 버전, 설정 오류를 잡는다
      - name: Expo Doctor
        run: pnpm --filter mobile expo:doctor
      # 실제 iOS·Android JS 번들이 만들어지는지 확인한다 (Metro 해석·babel 오류 검출)
      - name: Expo export
        run: pnpm --filter mobile export
